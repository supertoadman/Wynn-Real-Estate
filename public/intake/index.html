<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wynn Website Questions</title>
<!--
  Client intake form for the Wynn Real Estate website.

  A single self-contained page (no build step, no dependencies) so it opens
  instantly from a text message on any phone. Answers are kept in the browser
  until the last screen, where "Send my answers" posts them to FormSubmit
  (formsubmit.co), which emails them to SEND_TO_EMAIL. If that fails, the
  screen offers a ready-written text or email instead.

  SEND_TO_PHONE / SEND_TO_EMAIL are set in the script below. To send one
  person's answers somewhere else, add the recipient after a # when sharing
  the link:  .../intake/#2155550123  or  .../intake/#you@example.com
-->
<style>
  html { font-size: 20px; -webkit-text-size-adjust: 100%; color-scheme: light; }
  html.big { font-size: 24px; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f8f7f4;
    color: #111114;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  [hidden] { display: none !important; }

  :focus { outline: 4px solid #0b57d0; outline-offset: 3px; }
  main:focus, h1:focus { outline: none; }

  .skip { position: absolute; left: -999rem; top: 0; background: #fff; padding: 0.6rem 1rem; }
  .skip:focus { left: 0.5rem; top: 0.5rem; z-index: 5; }

  /* Top bar */
  .top { background: #09090b; color: #fff; }
  .top-inner {
    max-width: 34rem; margin: 0 auto; padding: 0.6rem 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 700; letter-spacing: 0.04em; color: #f5b700; font-size: 0.9rem; }
  .mini {
    font: inherit; font-size: 0.8rem; font-weight: 600; color: #fff; background: transparent;
    border: 2px solid #fff; border-radius: 0.5rem; padding: 0.4rem 0.7rem; min-height: 2.4rem; cursor: pointer;
  }

  .wrap { max-width: 34rem; margin: 0 auto; padding: 1rem 1rem 4rem; }

  /* Progress */
  .where { font-size: 0.85rem; font-weight: 700; color: #4a4a52; margin: 0.2rem 0 0.4rem; }
  .where b { color: #c8102e; }
  .bar { height: 0.6rem; background: #dedad0; border-radius: 1rem; overflow: hidden; }
  .bar span { display: block; height: 100%; background: #c8102e; border-radius: 1rem; }

  h1 { font-size: 1.55rem; line-height: 1.2; margin: 1.3rem 0 0.5rem; }
  h2 { font-size: 1.15rem; margin: 1.6rem 0 0.4rem; }
  p { margin: 0.5rem 0; }
  .help { color: #3a3a42; margin: 0 0 1rem; }
  .small { font-size: 0.85rem; color: #4a4a52; }

  /* Fields */
  label.field { display: block; font-weight: 700; margin-bottom: 0.4rem; }
  input.txt, textarea.txt, select.txt {
    display: block; width: 100%; font: inherit; font-size: 1.1rem; color: #111114; background: #fff;
    border: 2px solid #09090b; border-radius: 0.6rem; padding: 0.8rem; margin: 0;
  }
  textarea.txt { min-height: 8rem; resize: vertical; }

  /* Tap-to-answer options */
  .opt {
    display: block; width: 100%; text-align: left; font: inherit; font-size: 1.1rem; font-weight: 600;
    color: #111114; background: #fff; border: 2px solid #09090b; border-radius: 0.7rem;
    padding: 0.9rem 1rem 0.9rem 3rem; min-height: 3.4rem; margin: 0.6rem 0 0; cursor: pointer; position: relative;
  }
  .opt::before {
    content: ""; position: absolute; left: 0.9rem; top: 50%; margin-top: -0.7rem;
    width: 1.4rem; height: 1.4rem; border: 2px solid #09090b; border-radius: 50%; background: #fff;
  }
  .opt.multi::before { border-radius: 0.3rem; }
  .opt[aria-pressed="true"] { background: #09090b; color: #fff; }
  .opt[aria-pressed="true"]::before { background: #f5b700; border-color: #f5b700; }
  .opt[aria-pressed="true"]::after {
    content: ""; position: absolute; left: 1.38rem; top: 50%; margin-top: -0.5rem;
    width: 0.4rem; height: 0.75rem; border: solid #09090b; border-width: 0 0.2rem 0.2rem 0;
    -webkit-transform: rotate(45deg); transform: rotate(45deg);
  }

  /* Buttons */
  .btn {
    display: block; width: 100%; font: inherit; font-size: 1.2rem; font-weight: 700; text-align: center;
    text-decoration: none; color: #fff; background: #c8102e; border: 2px solid #c8102e; border-radius: 0.8rem;
    padding: 0.9rem 1rem; min-height: 3.6rem; margin: 1.2rem 0 0; cursor: pointer;
  }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .btn.plain { color: #09090b; background: transparent; border-color: #09090b; font-size: 1rem; min-height: 3.2rem; margin-top: 0.7rem; }
  .pair { display: flex; margin: 0 -0.35rem; }
  .pair .btn { margin-left: 0.35rem; margin-right: 0.35rem; }
  .link {
    font: inherit; font-size: 0.9rem; font-weight: 600; color: #09090b; background: none; border: 0;
    text-decoration: underline; padding: 0.7rem 0.2rem; min-height: 2.6rem; cursor: pointer;
  }
  .tools { display: flex; justify-content: space-between; margin-top: 0.3rem; }

  /* Lists */
  ul.plainlist { padding-left: 1.2rem; margin: 0.6rem 0; }
  ul.plainlist li { margin: 0.5rem 0; }
  .card { background: #fff; border: 2px solid #09090b; border-radius: 0.8rem; padding: 0.9rem 1rem; margin: 0.8rem 0; }
  .note { background: #fff6d6; border: 2px solid #b38600; border-radius: 0.8rem; padding: 0.8rem 1rem; margin: 1rem 0; }
  .sec {
    display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: left;
    font: inherit; font-size: 1.05rem; font-weight: 700; color: #111114; background: #fff;
    border: 2px solid #09090b; border-radius: 0.7rem; padding: 0.8rem 1rem; min-height: 3.4rem; margin: 0.6rem 0 0; cursor: pointer;
  }
  .sec span { font-size: 0.85rem; font-weight: 600; color: #4a4a52; margin-left: 0.8rem; white-space: nowrap; }
  dl.answers { margin: 0; }
  dl.answers dt { font-size: 0.8rem; font-weight: 700; color: #4a4a52; margin-top: 0.8rem; }
  dl.answers dd { margin: 0.1rem 0 0; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; }
  dl.answers button { margin-left: -0.2rem; }
  textarea.out { font-size: 0.8rem; min-height: 10rem; }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the question</a>

<header class="top">
  <div class="top-inner">
    <span class="brand">WYNN REAL ESTATE</span>
    <button type="button" class="mini" id="sizeBtn" aria-pressed="false">Bigger text</button>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<noscript>
  <div class="wrap"><p>This form needs JavaScript switched on. Please call or text the person who sent it to you and they will ask you the questions instead.</p></div>
</noscript>

<script>
(function () {
  "use strict";

  var STORE = "wynn-intake-v2";

  // Where finished answers are sent. A #number or #email on the link overrides these.
  var SEND_TO_PHONE = "+12159393713";
  var SEND_TO_EMAIL = "stevenwynn4@gmail.com";
  // FormSubmit relays a JSON POST to that address: https://formsubmit.co/ajax-documentation
  var SEND_URL = "https://formsubmit.co/ajax/";

  var SECTIONS = [
    { id: "you", title: "About you" },
    { id: "brokerage", title: "Your brokerage" },
    { id: "contact", title: "How people reach you" },
    { id: "work", title: "Where you work and what you do" },
    { id: "record", title: "Your track record" },
    { id: "homes", title: "Homes to show" },
    { id: "story", title: "Your story" },
    { id: "wrap", title: "Photos and last things" }
  ];

  var YES_NO = [{ v: "yes", t: "Yes" }, { v: "no", t: "No" }];
  var YES_NO_UNSURE = [{ v: "yes", t: "Yes" }, { v: "no", t: "No" }, { v: "unsure", t: "I am not sure" }];

  function is(id, value) { return function (a) { return a[id] === value; }; }
  function filled(id) {
    return function (a) {
      var v = a[id];
      return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
    };
  }

  var PA_COUNTIES = ["Adams", "Allegheny", "Armstrong", "Beaver", "Bedford", "Berks", "Blair", "Bradford", "Bucks", "Butler",
    "Cambria", "Cameron", "Carbon", "Centre", "Chester", "Clarion", "Clearfield", "Clinton", "Columbia", "Crawford",
    "Cumberland", "Dauphin", "Delaware", "Elk", "Erie", "Fayette", "Forest", "Franklin", "Fulton", "Greene",
    "Huntingdon", "Indiana", "Jefferson", "Juniata", "Lackawanna", "Lancaster", "Lawrence", "Lebanon", "Lehigh", "Luzerne",
    "Lycoming", "McKean", "Mercer", "Mifflin", "Monroe", "Montgomery", "Montour", "Northampton", "Northumberland", "Perry",
    "Philadelphia", "Pike", "Potter", "Schuylkill", "Snyder", "Somerset", "Sullivan", "Susquehanna", "Tioga", "Union",
    "Venango", "Warren", "Washington", "Wayne", "Westmoreland", "Wyoming", "York"];

  /** Options whose stored value is the same as the words on the button. */
  function plain(list) { return list.map(function (text) { return { v: text, t: text }; }); }

  /*
    One entry per screen. `label` is the short name used in the message that
    gets sent back. `when` hides follow-up questions that don't apply.
    Rule references are in the comments so the reason for a question survives.

    Typing is kept to facts only the agent knows (names, numbers, addresses).
    Everything else is a tap: `choice` (pick one), `multi` (pick any) or
    `select` (a long list in the phone's own picker).
  */
  var QUESTIONS = [
    /* ---------------------------------------------------------- About you */
    // 49 Pa. Code 35.305: advertise under the licensed name.
    { id: "licName", section: "you", type: "text", label: "Name on license", autocomplete: "name",
      q: "What is your full name, exactly as it is printed on your real estate license?",
      help: "Please copy it the way the license shows it, middle initial and all." },
    // 35.305(b): a first-name nickname must be on file with the Commission.
    { id: "nick", section: "you", type: "choice", label: "Goes by a different first name",
      q: "Do clients know you by a different first name?",
      help: "For example, Peggy instead of Margaret.",
      options: [{ v: "no", t: "No, I use the name on my license", s: "No" }, { v: "yes", t: "Yes, I go by a different first name", s: "Yes" }] },
    { id: "nickName", section: "you", type: "text", label: "Preferred first name", when: is("nick", "yes"),
      q: "What name do you go by?" },
    { id: "nickReg", section: "you", type: "choice", label: "Nickname on file with the Commission", when: is("nick", "yes"),
      q: "Is that nickname on file with the Pennsylvania Real Estate Commission?",
      help: "Pennsylvania only lets you advertise a nickname that you put on your license application or renewal.",
      options: YES_NO_UNSURE },
    { id: "licType", section: "you", type: "choice", label: "License type",
      q: "Which kind of license do you hold?",
      options: [{ v: "Salesperson", t: "Salesperson" }, { v: "Associate broker", t: "Associate broker" },
                { v: "Broker", t: "Broker (I run the brokerage)", s: "Broker" }, { v: "Not sure", t: "I am not sure" }] },
    { id: "licNum", section: "you", type: "text", label: "PA license number", autocapitalize: "characters",
      q: "What is your Pennsylvania license number?",
      help: "It is printed on your license. We use it to check that the website matches the state's records." },
    // NAR Standard of Practice 12-9: website shows state(s) of licensure.
    { id: "otherStates", section: "you", type: "multi", label: "Also licensed in",
      q: "Are you licensed in any other states?",
      help: "Tap any that apply. If it is only Pennsylvania, just tap Next.",
      options: plain(["New Jersey", "Delaware", "Maryland", "New York", "Ohio", "West Virginia", "Florida", "Another state"]) },
    { id: "realtor", section: "you", type: "choice", label: "REALTOR member",
      q: "Are you a member of the National Association of REALTORS?",
      help: "Only members may call themselves a REALTOR, so this tells us which word to use.",
      options: YES_NO_UNSURE },
    // NAR 12-13: only credentials actually held.
    { id: "desig", section: "you", type: "multi", label: "Designations held",
      q: "Do you hold any of these designations?",
      help: "Tap the ones you hold today. If you have none, just tap Next.",
      options: plain(["ABR", "CRS", "GRI", "SRES", "SRS", "e-PRO", "CLHMS", "PSA", "MRP", "C2EX", "Another one"]) },

    /* ------------------------------------------------------ Your brokerage */
    { id: "role", section: "brokerage", type: "choice", label: "Role at the brokerage",
      q: "Which of these describes you?",
      options: [{ v: "Owns/runs the brokerage", t: "I own or run the brokerage" },
                { v: "Works under a broker", t: "I work under a broker at a company" },
                { v: "Not sure", t: "I am not sure" }] },
    // 35.305(a) and (c): licensed business name and the broker's phone number.
    { id: "brokerName", section: "brokerage", type: "text", label: "Brokerage licensed name", autocomplete: "organization",
      q: "What is the brokerage's business name, exactly as printed on its license?",
      help: "Pennsylvania requires this name on your website, so please copy it carefully." },
    { id: "brokerPhone", section: "brokerage", type: "text", inputType: "tel", label: "Brokerage office phone", autocomplete: "off",
      q: "What is the brokerage office's main phone number?",
      help: "The office's own number, not your cell phone. Pennsylvania requires it on the website, shown as large as your own number." },
    { id: "brokerInCharge", section: "brokerage", type: "text", label: "Broker in charge (name and phone)",
      when: function (a) { return a.role !== "Owns/runs the brokerage"; },
      q: "Who is the broker in charge of your office, and what is their phone number?",
      help: "The broker is responsible for your advertising, so they should look at the website before it goes public." },
    { id: "siteName", section: "brokerage", type: "choice", label: "What the name Wynn Real Estate is",
      q: "The website is called Wynn Real Estate. What is that name?",
      help: "Pennsylvania only allows advertising under the name on the brokerage's license, so we need to get this right.",
      options: [{ v: "The brokerage's licensed name", t: "It is the brokerage's licensed name" },
                { v: "A team name", t: "It is my team's name" },
                { v: "A made-up name, not registered", t: "It is a name we made up for the website" },
                { v: "Not sure", t: "I am not sure" }] },
    { id: "franchise", section: "brokerage", type: "select", label: "National brand",
      q: "Is the brokerage part of a national brand?",
      help: "Tap the box and pick from the list.",
      options: ["No, it is independent", "Berkshire Hathaway HomeServices", "Century 21", "Coldwell Banker", "Compass",
                "eXp Realty", "Howard Hanna", "Keller Williams", "Long and Foster", "RE/MAX", "Sotheby's International Realty",
                "Weichert", "Another brand", "I am not sure"] },
    // State Real Estate Commission team advertising guideline (2005).
    { id: "team", section: "brokerage", type: "choice", label: "Works on a team",
      q: "Do you work as part of a team?", options: YES_NO },
    { id: "teamName", section: "brokerage", type: "text", label: "Team name", when: is("team", "yes"),
      q: "What is the team called?",
      help: "In Pennsylvania a team name must be the licensed name of someone on the team, like Jane Wynn Team. Made-up names are not allowed." },
    { id: "teamMembers", section: "brokerage", type: "long", label: "Team members", when: is("team", "yes"),
      q: "Who is on the team?",
      help: "Type each licensed member's full name as it appears on their license, one per line. Helpers without a license cannot be shown as team members." },
    { id: "address", section: "brokerage", type: "long", label: "Office address", autocomplete: "street-address",
      q: "What office address should the website show?",
      help: "Street, town and ZIP code." },
    { id: "hours", section: "brokerage", type: "choice", label: "Hours",
      q: "What hours should the website show?",
      options: plain(["Monday to Friday, 9 to 5", "Monday to Friday 9 to 5, weekends by appointment",
                      "Every day, 8 to 8", "By appointment only", "Do not show hours"]) },

    /* ------------------------------------------------ How people reach you */
    { id: "phone", section: "contact", type: "text", inputType: "tel", label: "Agent's public phone", autocomplete: "tel",
      q: "What phone number should clients use to reach you?" },
    { id: "textOk", section: "contact", type: "choice", label: "Clients may text that number",
      q: "Is it all right for clients to text that number?", options: YES_NO },
    { id: "email", section: "contact", type: "text", inputType: "email", label: "Public email", autocomplete: "email",
      q: "What email address should the website show?" },
    { id: "leadsTo", section: "contact", type: "choice", label: "Where website enquiries go",
      q: "When someone fills in the Request a consultation form on the website, where should it go?",
      options: [{ v: "Email", t: "Send it to my email" }, { v: "Text", t: "Text it to my phone" },
                { v: "Email and text", t: "Both" }, { v: "Someone else handles them", t: "Someone else handles them" }] },
    // NAR Article 12: the site must give a true picture.
    { id: "reply", section: "contact", type: "choice", label: "Usual reply time",
      q: "How quickly do you reply when a new client contacts you?",
      help: "The website currently promises one business day.",
      options: plain(["Within an hour", "The same day", "Within one business day", "Within two business days"]) },
    { id: "crm", section: "contact", type: "choice", label: "Client-tracking program",
      q: "Which program do you use to keep track of clients?",
      options: plain(["I do not use one", "Follow Up Boss", "kvCORE or BoldTrail", "Lofty", "Top Producer", "Wise Agent",
                      "The one my brokerage gives me", "A different one", "I am not sure"]) },
    { id: "social", section: "contact", type: "multi", label: "Has these pages",
      q: "Which of these do you have for your business?",
      help: "Tap every one you have. If you have none, just tap Next. We will look up the links.",
      options: [{ v: "Facebook", t: "Facebook page" }, { v: "Instagram", t: "Instagram" }, { v: "LinkedIn", t: "LinkedIn" },
                { v: "YouTube", t: "YouTube" }, { v: "Zillow", t: "Zillow profile" }, { v: "Google", t: "Google business listing" }] },
    // NAR 12-12: domain names must give a true picture.
    { id: "domain", section: "contact", type: "choice", label: "Owns a website address",
      q: "Do you already own a website address, like wynnrealestate.com?", options: YES_NO_UNSURE },
    { id: "domainName", section: "contact", type: "text", label: "Website address", when: is("domain", "yes"), inputType: "url", autocapitalize: "none",
      q: "What is the website address?" },
    { id: "domainWho", section: "contact", type: "choice", label: "Who has the website login", when: is("domain", "yes"),
      q: "Who has the login for that website address?",
      options: plain(["I do", "My brokerage", "A family member or friend", "A website company", "I am not sure"]) },

    /* ------------------------------------ Where you work and what you do */
    { id: "towns", section: "work", type: "text", label: "Towns and neighborhoods",
      q: "Which towns or neighborhoods do you work in most?",
      help: "Type up to six, with commas between them. Best ones first." },
    // 35.307(b): a market-position claim must name the municipality.
    { id: "county", section: "work", type: "select", label: "Main county",
      q: "Which county is your main market?",
      help: "Tap the box and pick from the list.",
      options: PA_COUNTIES },
    { id: "services", section: "work", type: "multi", label: "Services",
      q: "Which of these do you do?",
      help: "Tap every one that applies, then tap Next.",
      options: [{ v: "Buyers", t: "Help people buy a home" }, { v: "Sellers", t: "Help people sell a home" },
                { v: "Luxury", t: "Luxury homes" }, { v: "Investment", t: "Investment and rental properties" },
                { v: "New construction", t: "New construction" }, { v: "Relocation", t: "Relocation" },
                { v: "Rentals", t: "Rentals and leasing" }, { v: "Land", t: "Land and farms" },
                { v: "Commercial", t: "Commercial property" }, { v: "Seniors", t: "Downsizing and estates" }] },
    // NAR Article 12: every claim on the site must be true.
    { id: "claims", section: "work", type: "multi", label: "Website claims that are TRUE",
      q: "The website says the things below. Tap each one that is true for you.",
      help: "Anything you do not tap will be taken off the website.",
      options: [{ v: "A third of sales are off-market", t: "About a third of my sales never reach the open market" },
                { v: "Pro photography and film", t: "I arrange professional photos and video for my listings" },
                { v: "Refers inspectors, attorneys, lenders", t: "I connect clients with inspectors, attorneys and lenders" },
                { v: "1031 exchanges", t: "I help with 1031 exchanges" },
                { v: "Out-of-area relocation", t: "I help clients moving from other states or countries" },
                { v: "Works with builders", t: "I work with builders and new developments" },
                { v: "Investment analysis", t: "I prepare investment and cash-flow figures for investors" }] },
    { id: "afba", section: "work", type: "choice", label: "Paid by or part-owner of a recommended business",
      q: "Do you get a fee from, or own part of, any lender, title company or other business you recommend?",
      help: "If so, the website may need to say so.", options: YES_NO_UNSURE },

    /* ---------------------------------------------------- Your track record */
    { id: "experience", section: "record", type: "choice", label: "Years licensed",
      q: "How long have you held a real estate license?",
      options: plain(["Less than 2 years", "2 to 5 years", "6 to 10 years", "11 to 20 years", "21 to 30 years", "More than 30 years"]) },
    // 35.307(a): sales volume may only count closed transactions.
    { id: "homesSold", section: "record", type: "choice", label: "Homes sold (closed), career",
      q: "About how many homes have you sold in your career?",
      help: "Closed sales only. A best guess is fine.",
      options: plain(["Fewer than 25", "25 to 100", "100 to 250", "250 to 500", "More than 500", "I am not sure"]) },
    { id: "volume", section: "record", type: "choice", label: "Career sales volume (estimate)",
      q: "Roughly what is your total sales volume over your career?",
      help: "Closed sales only. A best guess is fine. We will confirm the exact figure before it goes on the website.",
      options: plain(["Under $10 million", "$10 to $50 million", "$50 to $100 million", "$100 to $250 million",
                      "More than $250 million", "I am not sure"]) },
    { id: "proof", section: "record", type: "choice", label: "Source for sales figures",
      q: "Where could we get a report that proves your sales numbers?",
      help: "Pennsylvania only lets closed sales be counted, so every number on the website needs a source.",
      options: plain(["From the MLS", "From my brokerage", "From my own records", "I am not sure"]) },
    { id: "showNumbers", section: "record", type: "multi", label: "Numbers to show if provable",
      q: "Which numbers would you like on the website, if the report backs them up?",
      help: "Tap any you like. If you would rather show none, just tap Next.",
      options: plain(["Years of experience", "Number of homes sold", "Total sales volume",
                      "Average days on market", "Sale price compared with asking price"]) },
    { id: "awards", section: "record", type: "choice", label: "Has awards or rankings to mention",
      q: "Have you won any awards or rankings you would like mentioned?",
      help: "If yes, we will ask you for the details later.", options: YES_NO },

    /* -------------------------------------------------------- Homes to show */
    { id: "mls", section: "homes", type: "choice", label: "MLS",
      q: "Which MLS do you belong to?",
      help: "MLS means multiple listing service.",
      options: plain(["Bright MLS", "West Penn Multi-List", "Greater Lehigh Valley", "A different one", "I am not sure"]) },
    { id: "listingsCount", section: "homes", type: "choice", label: "Homes for sale now",
      q: "How many homes do you have for sale right now?",
      help: "We will get the details from the MLS, so there is nothing to type.",

      q: "If we have a question, what is the best way to reach you?",

  /* ------------------------------------------------------------------ State */

  var state = { answers: {}, view: "welcome", at: null, big: false, fromReview: false };

  function load() {
    try {
      var saved = JSON.parse(window.localStorage.getItem(STORE) || "null");
      if (saved && typeof saved === "object" && saved.answers) {
        state.answers = saved.answers;
        state.at = saved.at || null;
        state.big = !!saved.big;
      }
    } catch (error) { /* storage unavailable: the form still works for this visit */ }
  }

  function save() {
    try {
      window.localStorage.setItem(STORE, JSON.stringify({ answers: state.answers, at: state.at, big: state.big }));
    } catch (error) { /* ignore */ }
  }

  function hasAnswer(id) { return filled(id)(state.answers); }
  function visible() { return QUESTIONS.filter(function (q) { return !q.when || q.when(state.answers); }); }
  function byId(id) {
    for (var i = 0; i < QUESTIONS.length; i += 1) if (QUESTIONS[i].id === id) return QUESTIONS[i];
    return null;
  }
  function answeredCount() { return visible().filter(function (q) { return hasAnswer(q.id); }).length; }

  function optionText(q, value, short) {
    for (var i = 0; i < q.options.length; i += 1) {
      if (q.options[i].v === value) return short ? (q.options[i].s || q.options[i].v) : q.options[i].t;
    }
    return value;
  }

  /** The answer as plain words, for the review screen and the message. */
  function valueText(q) {
    var value = state.answers[q.id];
    if (q.type === "multi") return value.join("; ");
    if (q.type === "choice") {
      if (value === "yes") return "Yes";
      if (value === "no") return "No";
      if (value === "unsure") return "Not sure";
      return optionText(q, value, true);
    }
    return String(value).trim();
  }

  function buildSummary() {
    var lines = ["WYNN WEBSITE ANSWERS"];
    var blank = [];
    var shown = visible();
    SECTIONS.forEach(function (section) {
      var got = [];
      shown.forEach(function (q) {
        if (q.section !== section.id) return;
        if (hasAnswer(q.id)) got.push(q.label + ": " + valueText(q));
        else blank.push(q.label);
      });
      if (got.length) {
        lines.push("", "== " + section.title.toUpperCase() + " ==");
        lines = lines.concat(got);
      }
    });
    if (blank.length) lines.push("", "LEFT BLANK: " + blank.join("; "));
    return lines.join("\n");
  }

  /** Who the finished answers go to: the defaults above, unless the link carries #number or #email. */
  function recipient() {
    var to = { phone: SEND_TO_PHONE, email: SEND_TO_EMAIL };
    var raw = "";
    try { raw = decodeURIComponent((window.location.hash || "").replace(/^#/, "")); } catch (error) { raw = ""; }
    raw = raw.replace(/^to=/i, "").trim();
    var digits = raw.replace(/[^\d+]/g, "");
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(raw)) to.email = raw;
    else if (/^\+?\d{10,15}$/.test(digits)) to.phone = digits;
    return to;
  }

  /** +12159393713 -> 215-939-3713, for showing the number to the person filling in the form. */
  function prettyPhone(phone) {
    var match = /^(?:\+?1)?(\d{3})(\d{3})(\d{4})$/.exec(phone);
    return match ? match[1] + "-" + match[2] + "-" + match[3] : phone;
  }

  /* -------------------------------------------------------------- Rendering */

  var app = document.getElementById("app");

  function el(tag, props, children) {
    var node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (key) {
        var value = props[key];
        if (value === undefined || value === null || value === false) return;
        if (key === "text") node.textContent = value;
        else if (key === "onclick") node.addEventListener("click", value);
        else if (key === "class") node.className = value;
        else node.setAttribute(key, value === true ? "" : value);
      });
    }
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function show(nodes) {
    while (app.firstChild) app.removeChild(app.firstChild);
    nodes.forEach(function (node) { if (node) app.appendChild(node); });
    window.scrollTo(0, 0);
    var heading = app.querySelector("h1");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    stopSpeaking();
  }

  function render() {
    if (state.view === "question") renderQuestion();
    else if (state.view === "sections") renderSections();
    else if (state.view === "review") renderReview();
    else if (state.view === "send") renderSend();
    else if (state.view === "sent") renderSent();
    else renderWelcome();
  }

  function goTo(view, id) {
    state.view = view;
    if (id) state.at = id;
    save();
    render();
  }

  /* Read-aloud, where the phone supports it. */
  var canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  function stopSpeaking() { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (error) { /* ignore */ } } }
  function speak(text) {
    if (!canSpeak) return;
    stopSpeaking();
    try {
      var utterance = new window.SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } catch (error) { /* ignore */ }
  }

  /* ---------------------------------------------------------------- Welcome */

  function renderWelcome() {
    var done = answeredCount();
    var nodes = [
      el("h1", { text: done ? "Welcome back" : "A few questions for your new website" }),
      done
        ? el("p", { text: "You have answered " + done + " so far. Everything is still here." })
        : el("p", { text: "Your answers tell us what to put on the Wynn Real Estate website, and help us follow Pennsylvania's advertising rules." }),
      el("ul", { class: "plainlist" }, [
        el("li", { text: "One question at a time. Almost all of them are just a tap." }),
        el("li", { text: "Not sure about one? Tap Skip." }),
        el("li", { text: "It saves by itself. You can stop and come back later." }),
        el("li", { text: "Nothing is sent until you press Send at the end." })
      ]),
      el("p", { class: "small", text: "It takes about 10 minutes. Having your license nearby will help." }),
      el("button", {
        type: "button", class: "btn", text: done ? "Carry on" : "Start",
        onclick: function () {
          var list = visible();
          var resume = state.at && byId(state.at) ? state.at : list[0].id;
          state.fromReview = false;
          goTo("question", resume);
        }
      })
    ];
    if (done) {
      nodes.push(el("button", { type: "button", class: "btn plain", text: "See all sections", onclick: function () { goTo("sections"); } }));
      nodes.push(startOverButton());
    }
    show(nodes);
  }

  function startOverButton() {
    var armed = false;
    var button = el("button", { type: "button", class: "link", text: "Erase my answers and start again" });
    button.addEventListener("click", function () {
      if (!armed) {
        armed = true;
        button.textContent = "Tap again to erase everything";
        window.setTimeout(function () { armed = false; button.textContent = "Erase my answers and start again"; }, 6000);
        return;
      }
      state.answers = {};
      state.at = null;
      save();
      goTo("welcome");
    });
    return el("p", null, [button]);
  }

  /* --------------------------------------------------------------- Question */

  function renderQuestion() {
    var list = visible();
    var index = -1;
    for (var i = 0; i < list.length; i += 1) if (list[i].id === state.at) index = i;
    if (index < 0) { index = 0; state.at = list[0].id; }
    var q = list[index];
    var section = SECTIONS.filter(function (s) { return s.id === q.section; })[0];
    var helpId = "help-" + q.id;

    function next() {
      if (state.fromReview) { state.fromReview = false; goTo("review"); return; }
      var fresh = visible();
      var position = -1;
      for (var j = 0; j < fresh.length; j += 1) if (fresh[j].id === q.id) position = j;
      if (position + 1 < fresh.length) goTo("question", fresh[position + 1].id);
      else goTo("review");
    }
    function back() {
      state.fromReview = false;
      if (index === 0) goTo("welcome");
      else goTo("question", list[index - 1].id);
    }

    var bar = el("div", { class: "bar", "aria-hidden": "true" }, [el("span")]);
    bar.firstChild.style.width = Math.round(((index + 1) / list.length) * 100) + "%";

    var where = el("p", { class: "where" });
    where.appendChild(el("b", { text: section.title }));
    where.appendChild(document.createTextNode("  ·  Question " + (index + 1) + " of " + list.length));

    var heading = el("h1", { id: "question", text: q.q });
    var help = q.help ? el("p", { class: "help", id: helpId, text: q.help }) : null;

    var body;
    if (q.type === "choice" || q.type === "multi") {
      body = el("div", { role: "group", "aria-labelledby": "question" });
      q.options.forEach(function (option) {
        var selected = q.type === "multi"
          ? (state.answers[q.id] || []).indexOf(option.v) >= 0
          : state.answers[q.id] === option.v;
        var button = el("button", {
          type: "button", class: q.type === "multi" ? "opt multi" : "opt",
          "aria-pressed": selected ? "true" : "false", text: option.t
        });
        button.addEventListener("click", function () {
          if (q.type === "multi") {
            var current = (state.answers[q.id] || []).slice();
            var at = current.indexOf(option.v);
            if (at >= 0) current.splice(at, 1); else current.push(option.v);
            state.answers[q.id] = current;
            button.setAttribute("aria-pressed", at >= 0 ? "false" : "true");
            save();
          } else {
            state.answers[q.id] = option.v;
            save();
            var all = body.querySelectorAll(".opt");
            for (var k = 0; k < all.length; k += 1) all[k].setAttribute("aria-pressed", "false");
            button.setAttribute("aria-pressed", "true");
            // A short pause so the tap visibly registers before moving on.
            window.setTimeout(next, 350);
          }
        });
        body.appendChild(button);
      });
    } else if (q.type === "select") {
      var picker = el("select", { class: "txt", id: "answer", "aria-labelledby": "question" });
      picker.appendChild(el("option", { value: "", text: "Tap here to choose" }));
      q.options.forEach(function (name) { picker.appendChild(el("option", { value: name, text: name })); });
      picker.value = state.answers[q.id] || "";
      picker.addEventListener("change", function () { state.answers[q.id] = picker.value; save(); });
      body = el("div", null, [picker]);
    } else {
      var input;
      if (q.type === "long") {
        input = el("textarea", { class: "txt", id: "answer", rows: "5" });
      } else {
        input = el("input", { class: "txt", id: "answer", type: q.inputType || "text", enterkeyhint: "next" });
        input.addEventListener("keydown", function (event) {
          if (event.key === "Enter") { event.preventDefault(); next(); }
        });
      }
      input.setAttribute("aria-labelledby", "question");
      if (help) input.setAttribute("aria-describedby", helpId);
      if (q.autocomplete) input.setAttribute("autocomplete", q.autocomplete);
      if (q.inputmode) input.setAttribute("inputmode", q.inputmode);
      if (q.autocapitalize) input.setAttribute("autocapitalize", q.autocapitalize);
      input.value = state.answers[q.id] || "";
      input.addEventListener("input", function () { state.answers[q.id] = input.value; save(); });
      body = el("div", null, [input]);
    }

    var nextLabel = state.fromReview ? "Save and go back" : (index + 1 === list.length ? "Finish" : "Next");
    var nodes = [
      where, bar, heading, help, body,
      el("button", { type: "button", class: "btn", text: nextLabel, onclick: next }),
      el("div", { class: "pair" }, [
        el("button", { type: "button", class: "btn plain", text: "Back", onclick: back }),
        el("button", { type: "button", class: "btn plain", text: "Skip", onclick: next })
      ]),
      el("div", { class: "tools" }, [
        canSpeak ? el("button", { type: "button", class: "link", text: "Read it to me", onclick: function () { speak(q.q + ". " + (q.help || "")); } }) : el("span"),
        el("button", { type: "button", class: "link", text: "All sections", onclick: function () { state.fromReview = false; goTo("sections"); } })
      ])
    ];
    show(nodes);
  }

  /* --------------------------------------------------------------- Sections */

  function renderSections() {
    var list = visible();
    var nodes = [
      el("h1", { text: "All sections" }),
      el("p", { text: "Tap a section to go to it. You do not have to do them in order." })
    ];
    SECTIONS.forEach(function (section) {
      var questions = list.filter(function (q) { return q.section === section.id; });
      if (!questions.length) return;
      var done = questions.filter(function (q) { return hasAnswer(q.id); }).length;
      var button = el("button", { type: "button", class: "sec" });
      button.appendChild(document.createTextNode(section.title));
      button.appendChild(el("span", { text: done + " of " + questions.length + " answered" }));
      button.addEventListener("click", function () {
        var firstBlank = questions.filter(function (q) { return !hasAnswer(q.id); })[0] || questions[0];
        state.fromReview = false;
        goTo("question", firstBlank.id);
      });
      nodes.push(button);
    });
    nodes.push(el("button", { type: "button", class: "btn", text: "Check my answers and send", onclick: function () { goTo("review"); } }));
    nodes.push(startOverButton());
    show(nodes);
  }

  /* ----------------------------------------------------------------- Review */

  function renderReview() {
    var list = visible();
    var done = answeredCount();
    var nodes = [
      el("h1", { text: "Check your answers" }),
      el("p", { text: "You answered " + done + " of " + list.length + " questions. Blank ones are fine. We will ask about those later." })
    ];
    SECTIONS.forEach(function (section) {
      var questions = list.filter(function (q) { return q.section === section.id && hasAnswer(q.id); });
      if (!questions.length) return;
      var dl = el("dl", { class: "answers" });
      questions.forEach(function (q) {
        dl.appendChild(el("dt", { text: q.q }));
        var dd = el("dd");
        dd.appendChild(document.createTextNode(q.type === "choice" ? optionText(q, state.answers[q.id], false) : valueText(q)));
        dd.appendChild(el("br"));
        dd.appendChild(el("button", {
          type: "button", class: "link", text: "Change",
          "aria-label": "Change answer: " + q.label,
          onclick: function () { state.fromReview = true; goTo("question", q.id); }
        }));
        dl.appendChild(dd);
      });
      nodes.push(el("h2", { text: section.title }));
      nodes.push(el("div", { class: "card" }, [dl]));
    });
    nodes.push(el("button", { type: "button", class: "btn", text: "These are right. Go to Send", onclick: function () { goTo("send"); } }));
    nodes.push(el("button", { type: "button", class: "btn plain", text: "Answer more questions", onclick: function () { goTo("sections"); } }));
    show(nodes);
  }

  /* ------------------------------------------------------------------- Send */

  /** One field per answer, so the email arrives as a readable table. */
  function buildPayload() {
    var name = hasAnswer("licName") ? String(state.answers.licName).trim() : "";
    var payload = {
      _subject: "Wynn website answers" + (name ? ": " + name : ""),
      _template: "table",
      _captcha: "false"
    };
    var blank = [];
    var shown = visible();
    SECTIONS.forEach(function (section) {
      shown.forEach(function (q) {
        if (q.section !== section.id) return;
        if (hasAnswer(q.id)) payload[section.title + " / " + q.label] = valueText(q);
        else blank.push(q.label);
      });
    });
    if (blank.length) payload["Left blank"] = blank.join("; ");
    return payload;
  }

  function photosToSend() {
    var photos = [];
    if (state.answers.headshot === "yes") photos.push("Your photo of yourself");
    if (state.answers.logo === "Own logo") photos.push("Your logo");
    return photos;
  }

  function renderSend() {
    var to = recipient();
    var status = el("p", { class: "note", role: "status", hidden: true });
    var sendButton = el("button", { type: "button", class: "btn", text: "Send my answers" });
    var sending = false;

    /* Shown only if the automatic send fails, so nobody is left stuck. */
    var summary = buildSummary();
    var encoded = encodeURIComponent(summary);
    var out = el("textarea", { class: "txt out", id: "allAnswers", readonly: true, "aria-label": "All of your answers" });
    out.value = summary;
    function copy() {
      function ok() { status.hidden = false; status.textContent = "Copied. Now open a text or an email, press and hold in the message box, and choose Paste."; }
      function manual() {
        out.focus(); out.select();
        var worked = false;
        try { worked = document.execCommand("copy"); } catch (error) { worked = false; }
        if (worked) ok();
        else { status.hidden = false; status.textContent = "Press and hold on the box of answers below, choose Select All, then Copy."; }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(summary).then(ok, manual);
      else manual();
    }
    var fallback = el("div", { hidden: true }, [
      el("h2", { text: "Another way to send them" }),
      el("p", { text: "These open your own text or email with the answers already typed in. Then press Send there." }),
      // "?&body=" is the one spelling that both iPhone and Android accept.
      el("a", { class: "btn plain", href: "sms:" + to.phone + "?&body=" + encoded, text: "Text them to " + prettyPhone(to.phone) }),
      el("a", { class: "btn plain", href: "mailto:" + to.email + "?subject=" + encodeURIComponent("Wynn website answers") + "&body=" + encoded, text: "Email them" }),
      el("button", { type: "button", class: "btn plain", text: "Copy my answers", onclick: copy }),
      out
    ]);

    function failed(message) {
      sending = false;
      sendButton.disabled = false;
      sendButton.textContent = "Try sending again";
      status.hidden = false;
      status.textContent = message;
      fallback.hidden = false;
    }

    sendButton.addEventListener("click", function () {
      if (sending) return;
      if (!window.fetch) { failed("This phone cannot send automatically. Please use one of the other ways below."); return; }
      sending = true;
      sendButton.disabled = true;
      sendButton.textContent = "Sending...";
      status.hidden = true;
      window.fetch(SEND_URL + to.email, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(buildPayload())
      }).then(function (response) {
        return response.json().then(function (data) { return { ok: response.ok, data: data || {} }; });
      }).then(function (result) {
        if (result.ok && (result.data.success === true || result.data.success === "true")) goTo("sent");
        else failed("Sending did not work this time. Tap the button to try again, or use one of the other ways below.");
      }).catch(function () {
        failed("Your answers could not be sent. Check that your phone is online and try again, or use one of the other ways below.");
      });
    });

    show([
      el("h1", { text: "Last step: send your answers" }),
      el("p", { text: "Tap the red button and your answers go straight to the person building your website. There is nothing else to do." }),
      sendButton,
      status,
      fallback,
      el("button", { type: "button", class: "btn plain", text: "Go back and change something", onclick: function () { goTo("review"); } })
    ]);
  }

  function renderSent() {
    var to = recipient();
    var photos = photosToSend();
    var nodes = [
      el("h1", { text: "Sent. Thank you." }),
      el("p", { text: "Your answers are on their way. You do not need to do anything else here." })
    ];
    if (photos.length) {
      var listNode = el("ul", { class: "plainlist" });
      photos.forEach(function (item) { listNode.appendChild(el("li", { text: item })); });
      nodes.push(el("h2", { text: "One more thing, when it suits you" }));
      nodes.push(el("p", { text: "Please text these to " + prettyPhone(to.phone) + ":" }));
      nodes.push(listNode);
    }
    nodes.push(el("button", { type: "button", class: "btn plain", text: "Change something and send again", onclick: function () { goTo("review"); } }));
    nodes.push(el("p", { class: "small", text: "Your answers stay saved on this phone." }));
    show(nodes);
  }

  /* ------------------------------------------------------------------ Start */

  var sizeButton = document.getElementById("sizeBtn");
  function applySize() {
    document.documentElement.className = state.big ? "big" : "";
    sizeButton.setAttribute("aria-pressed", state.big ? "true" : "false");
    sizeButton.textContent = state.big ? "Smaller text" : "Bigger text";
  }
  sizeButton.addEventListener("click", function () { state.big = !state.big; applySize(); save(); });

  load();
  applySize();
  render();
})();
</script>
</body>
</html>
